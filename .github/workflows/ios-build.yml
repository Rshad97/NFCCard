name: Build NFCCard DEB

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          brew install xcodegen ldid dpkg

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build device app
        run: |
          set -euo pipefail
          xcodebuild \
            -project NFCCard.xcodeproj \
            -scheme NFCCard \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Sign jailbreak app entitlements
        run: |
          set -euo pipefail
          APP="$PWD/build/Build/Products/Release-iphoneos/NFCCard.app"
          test -d "$APP"
          test -f "$APP/NFCCard"
          ldid -SNFCCard/NFCCard.entitlements "$APP/NFCCard"
          /usr/bin/codesign -d --entitlements :- "$APP/NFCCard" 2>/dev/null || true

      - name: Build rootless DEB
        shell: bash
        run: |
          set -euo pipefail

          VERSION="0.2.1"
          ROOT="$RUNNER_TEMP/nfccard-package"
          APP="$PWD/build/Build/Products/Release-iphoneos/NFCCard.app"
          OUT="$PWD/packages"

          rm -rf "$ROOT" "$OUT"
          mkdir -p "$ROOT/var/jb/Applications" "$ROOT/DEBIAN" "$OUT"
          cp -R "$APP" "$ROOT/var/jb/Applications/NFCCard.app"

          cat > "$ROOT/DEBIAN/control" <<EOF
          Package: com.rashad.nfccard
          Name: NFCCard
          Version: $VERSION
          Architecture: iphoneos-arm64
          Description: NFC research and interoperability toolkit with Card Genome, Capability Map, Privacy Radar, Protocol Lens and Wallet Route Advisor.
          Maintainer: Rashad
          Author: Rashad
          Section: Applications
          Depends: firmware (>= 16.0)
          Homepage: https://github.com/Rshad97/NFCCard
          EOF
          sed -i '' 's/^          //' "$ROOT/DEBIAN/control"

          cat > "$ROOT/DEBIAN/postinst" <<'EOF'
          #!/bin/sh
          if command -v uicache >/dev/null 2>&1; then
              uicache -p /var/jb/Applications/NFCCard.app >/dev/null 2>&1 || true
          fi
          exit 0
          EOF

          cat > "$ROOT/DEBIAN/prerm" <<'EOF'
          #!/bin/sh
          if command -v uicache >/dev/null 2>&1; then
              uicache -u com.rashad.nfccard >/dev/null 2>&1 || true
          fi
          exit 0
          EOF

          sed -i '' 's/^          //' "$ROOT/DEBIAN/postinst" "$ROOT/DEBIAN/prerm"
          chmod 0755 "$ROOT/DEBIAN/postinst" "$ROOT/DEBIAN/prerm"

          dpkg-deb --root-owner-group -b "$ROOT" "$OUT/com.rashad.nfccard_${VERSION}_iphoneos-arm64.deb"
          dpkg-deb -I "$OUT/com.rashad.nfccard_${VERSION}_iphoneos-arm64.deb"
          dpkg-deb -c "$OUT/com.rashad.nfccard_${VERSION}_iphoneos-arm64.deb"

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: NFCCard-DEB
          path: packages/*.deb

      - name: Publish standalone Sileo repo
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          REPO="$RUNNER_TEMP/sileo-repo"
          rm -rf "$REPO"
          mkdir -p "$REPO/debs"

          DEB="$(ls -t packages/*.deb | head -n 1)"
          DEB_NAME="$(basename "$DEB")"
          cp "$DEB" "$REPO/debs/$DEB_NAME"

          PKG="$(dpkg-deb -f "$DEB" Package)"
          NAME="$(dpkg-deb -f "$DEB" Name)"
          VERSION="$(dpkg-deb -f "$DEB" Version)"
          ARCH="$(dpkg-deb -f "$DEB" Architecture)"
          DESC="$(dpkg-deb -f "$DEB" Description)"
          MAINTAINER="$(dpkg-deb -f "$DEB" Maintainer)"
          SECTION="$(dpkg-deb -f "$DEB" Section)"
          DEPENDS="$(dpkg-deb -f "$DEB" Depends)"
          SIZE="$(stat -f%z "$DEB")"
          MD5="$(md5 -q "$DEB")"
          SHA1="$(shasum -a 1 "$DEB" | awk '{print $1}')"
          SHA256="$(shasum -a 256 "$DEB" | awk '{print $1}')"
          SHA512="$(shasum -a 512 "$DEB" | awk '{print $1}')"

          cat > "$REPO/Packages" <<EOF
          Package: $PKG
          Name: $NAME
          Version: $VERSION
          Architecture: $ARCH
          Description: $DESC
          Maintainer: $MAINTAINER
          Section: $SECTION
          Depends: $DEPENDS
          Homepage: https://github.com/Rshad97/NFCCard
          Filename: ./debs/$DEB_NAME
          Size: $SIZE
          MD5sum: $MD5
          SHA1: $SHA1
          SHA256: $SHA256
          SHA512: $SHA512

          EOF
          sed -i '' 's/^          //' "$REPO/Packages"

          gzip -9c "$REPO/Packages" > "$REPO/Packages.gz"
          bzip2 -9c "$REPO/Packages" > "$REPO/Packages.bz2"

          cat > "$REPO/Release" <<'EOF'
          Origin: NFCCard
          Label: NFCCard
          Suite: stable
          Version: 1.0
          Codename: ios
          Architectures: iphoneos-arm64
          Components: main
          Description: NFCCard rootless jailbreak package repository
          EOF
          sed -i '' 's/^          //' "$REPO/Release"

          cd "$REPO"
          git init
          git checkout -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Publish NFCCard $VERSION"
          git remote add origin "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          git push --force origin gh-pages
