name: Build NFCCard DEB

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: nfccard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          brew install xcodegen ldid dpkg

      - name: Test scan recovery and package scripts
        run: |
          swift test
          python3 scripts/test-package-scripts.py

      - name: Prepare app icon
        run: |
          sh ./scripts/prepare-app-icon.sh

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Test scan error recovery on iPhone simulator
        timeout-minutes: 12
        run: |
          set -euo pipefail
          SIMULATOR_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for devices in json.load(sys.stdin)["devices"].values() for d in devices if d["name"].startswith("iPhone")))')"
          xcodebuild test \
            -project NFCCard.xcodeproj \
            -scheme NFCCard \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath "$PWD/build-simulator" \
            -resultBundlePath "$PWD/test-results/Simulator.xcresult" \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload simulator test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NFCCard-Simulator-Tests
          path: test-results/
          if-no-files-found: ignore

      - name: Build device app
        run: |
          set -euo pipefail
          xcodebuild \
            -project NFCCard.xcodeproj \
            -scheme NFCCard \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Validate app metadata and icon
        run: |
          set -euo pipefail
          APP="$PWD/build/Build/Products/Release-iphoneos/NFCCard.app"
          SOURCE_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' NFCCard/Info.plist)"
          APP_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")"

          test -d "$APP"
          test -f "$APP/NFCCard"
          test "$APP_VERSION" = "$SOURCE_VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" = "com.rashad.nfccard"
          /usr/libexec/PlistBuddy -c 'Print :NFCReaderUsageDescription' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :com.apple.developer.nfc.readersession.iso7816.select-identifiers' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :com.apple.developer.nfc.readersession.felica.systemcodes' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :UIRequiredDeviceCapabilities' "$APP/Info.plist"
          test -f "$APP/Assets.car"
          test -f design/AppIconSource.svg
          sips -s format jpeg design/AppIconSource.png --out "$RUNNER_TEMP/nfccard-icon-verified.jpg" >/dev/null
          test -s "$RUNNER_TEMP/nfccard-icon-verified.jpg"
          plutil -p "$APP/Info.plist"

      - name: Sign jailbreak app entitlements
        run: |
          set -euo pipefail
          APP="$PWD/build/Build/Products/Release-iphoneos/NFCCard.app"
          ldid -Icom.rashad.nfccard -Spackaging/NFCCard-jailbreak.entitlements "$APP/NFCCard"
          ldid -e "$APP/NFCCard" > "$RUNNER_TEMP/NFCCard.entitlements.plist"
          cat "$RUNNER_TEMP/NFCCard.entitlements.plist"
          python3 scripts/verify-app.py "$APP" packaging/NFCCard-jailbreak.entitlements NFCCard/Info.plist
          codesign --verify --verbose "$APP/NFCCard"

      - name: Build rootless DEB
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' NFCCard/Info.plist)"
          ROOT="$RUNNER_TEMP/nfccard-package"
          APP="$PWD/build/Build/Products/Release-iphoneos/NFCCard.app"
          OUT="$PWD/packages"

          rm -rf "$ROOT" "$OUT"
          mkdir -p "$ROOT/var/jb/Applications" "$ROOT/DEBIAN" "$OUT"
          cp -R "$APP" "$ROOT/var/jb/Applications/NFCCard.app"

          cat > "$ROOT/DEBIAN/control" <<EOF
          Package: com.rashad.nfccard
          Name: NFCCard
          Version: $VERSION
          Architecture: iphoneos-arm64
          Description: NFC research and interoperability toolkit with Protocol Atlas, Card Genome, Capability Map, Privacy Radar and Wallet Route Advisor.
          Maintainer: Rashad
          Author: Rashad
          Section: Applications
          Depends: firmware (>= 16.0)
          Homepage: https://github.com/Rshad97/NFCCard
          Icon: https://raw.githubusercontent.com/Rshad97/NFCCard/main/design/AppIconSource.png
          EOF
          sed -i '' 's/^          //' "$ROOT/DEBIAN/control"

          cp packaging/postinst packaging/prerm "$ROOT/DEBIAN/"
          chmod 0755 "$ROOT/DEBIAN/postinst" "$ROOT/DEBIAN/prerm"

          dpkg-deb --root-owner-group -b "$ROOT" "$OUT/com.rashad.nfccard_${VERSION}_iphoneos-arm64.deb"
          dpkg-deb -e "$OUT/com.rashad.nfccard_${VERSION}_iphoneos-arm64.deb" "$RUNNER_TEMP/nfccard-control-check"
          cmp packaging/postinst "$RUNNER_TEMP/nfccard-control-check/postinst"
          cmp packaging/prerm "$RUNNER_TEMP/nfccard-control-check/prerm"
          dpkg-deb -x "$OUT/com.rashad.nfccard_${VERSION}_iphoneos-arm64.deb" "$RUNNER_TEMP/nfccard-payload-check"
          python3 scripts/verify-app.py "$RUNNER_TEMP/nfccard-payload-check/var/jb/Applications/NFCCard.app" packaging/NFCCard-jailbreak.entitlements NFCCard/Info.plist
          cmp "$APP/NFCCard" "$RUNNER_TEMP/nfccard-payload-check/var/jb/Applications/NFCCard.app/NFCCard"
          dpkg-deb -I "$OUT/com.rashad.nfccard_${VERSION}_iphoneos-arm64.deb"
          dpkg-deb -c "$OUT/com.rashad.nfccard_${VERSION}_iphoneos-arm64.deb"

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: NFCCard-DEB
          path: packages/*.deb

      - name: Publish standalone Sileo repo
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          REPO="$RUNNER_TEMP/sileo-repo"
          rm -rf "$REPO"
          mkdir -p "$REPO/debs"

          DEB="$(ls -t packages/*.deb | head -n 1)"
          DEB_NAME="$(basename "$DEB")"
          cp "$DEB" "$REPO/debs/$DEB_NAME"

          PKG="$(dpkg-deb -f "$DEB" Package)"
          NAME="$(dpkg-deb -f "$DEB" Name)"
          VERSION="$(dpkg-deb -f "$DEB" Version)"
          ARCH="$(dpkg-deb -f "$DEB" Architecture)"
          DESC="$(dpkg-deb -f "$DEB" Description)"
          MAINTAINER="$(dpkg-deb -f "$DEB" Maintainer)"
          SECTION="$(dpkg-deb -f "$DEB" Section)"
          DEPENDS="$(dpkg-deb -f "$DEB" Depends)"
          ICON="$(dpkg-deb -f "$DEB" Icon 2>/dev/null || true)"
          SIZE="$(stat -f%z "$DEB")"
          MD5="$(md5 -q "$DEB")"
          SHA1="$(shasum -a 1 "$DEB" | awk '{print $1}')"
          SHA256="$(shasum -a 256 "$DEB" | awk '{print $1}')"
          SHA512="$(shasum -a 512 "$DEB" | awk '{print $1}')"

          {
            echo "Package: $PKG"
            echo "Name: $NAME"
            echo "Version: $VERSION"
            echo "Architecture: $ARCH"
            echo "Description: $DESC"
            echo "Maintainer: $MAINTAINER"
            echo "Section: $SECTION"
            echo "Depends: $DEPENDS"
            echo "Homepage: https://github.com/Rshad97/NFCCard"
            [ -n "$ICON" ] && echo "Icon: $ICON"
            echo "Filename: ./debs/$DEB_NAME"
            echo "Size: $SIZE"
            echo "MD5sum: $MD5"
            echo "SHA1: $SHA1"
            echo "SHA256: $SHA256"
            echo "SHA512: $SHA512"
            echo
          } > "$REPO/Packages"

          gzip -9c "$REPO/Packages" > "$REPO/Packages.gz"
          bzip2 -9c "$REPO/Packages" > "$REPO/Packages.bz2"

          cp design/AppIconSource.png "$REPO/icon.png"

          DATE_RFC2822="$(LC_ALL=C date -R)"
          {
            echo "Origin: NFCCard"
            echo "Label: NFCCard"
            echo "Suite: stable"
            echo "Version: 1.1"
            echo "Codename: ios"
            echo "Date: $DATE_RFC2822"
            echo "Architectures: iphoneos-arm64"
            echo "Components: main"
            echo "Description: NFCCard rootless jailbreak package repository"
            echo "MD5Sum:"
            for FILE in Packages Packages.gz Packages.bz2; do
              HASH="$(md5 -q "$REPO/$FILE")"
              SIZE="$(stat -f%z "$REPO/$FILE")"
              printf " %s %16s %s\n" "$HASH" "$SIZE" "$FILE"
            done
            echo "SHA256:"
            for FILE in Packages Packages.gz Packages.bz2; do
              HASH="$(shasum -a 256 "$REPO/$FILE" | awk '{print $1}')"
              SIZE="$(stat -f%z "$REPO/$FILE")"
              printf " %s %16s %s\n" "$HASH" "$SIZE" "$FILE"
            done
          } > "$REPO/Release"

          cd "$REPO"
          git init
          git checkout -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Publish NFCCard $VERSION"
          git remote add origin "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          git push --force origin gh-pages
